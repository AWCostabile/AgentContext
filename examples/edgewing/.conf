# —— AI Traits —————————————————————————————————————————————————————————————— #

# How Technical should the AI be?
# - for example: 'beginner', 'junior', 'mid', 'senior',
AI_TECHNICALITY=mid

# What sort of speaking tone should the AI possess?
# - for example: 'casual', 'direct', 'friendly', 'reserved'
AI_TONE=direct

# —— Personal Preferences ——————————————————————————————————————————————————— #

# Details about how you wish to be referred to in documentation.
MY_NAME="Robin Placeholder"
MY_NICK=Robin
MY_PRONOUNS=They,Them
MY_ROLE="Founder, developer"
MY_USER=robin

# —— Catalogs ——————————————————————————————————————————————————————————————— #

# The top-level buckets of `public/`, named by you. Each entry is one branch of
# `public/` and its mirror in `private/`. Tools read the names from here and never
# spell them.
CATALOGS="products"

# —— Private Tree —————————————————————————————————————————————————————————— #

# `private/` is this machine's own development-cycle tree: a nested git repository
# the parent ignores wholly. List the top-level private branches the search tools
# include by default. Unset or empty means public-only, which is what a fresh clone
# gets. `find.sh -p` searches everything under `private/` regardless of this key.
PRIVATE_SCOPES="products journal local"

# —— Orchestration ——————————————————————————————————————————————————————————— #

# How much delegation and ceremony an agent-run piece of work affords. The core
# scripts ignore this key; the process documents and an adapter read it.
# - 'full': the reference practice. Subagents per job, a review loop before the
#   pull request, close-out appendices.
# - 'lean': the orchestrator works inline and delegates only when a job's reading
#   would outgrow its own context; delegated jobs run in the background and the
#   orchestrator keeps working while they do; one short record at close-out.
#   Pick it where idle time is expensive, such as a plan whose prompt cache
#   expires after five minutes.
ORCH_BUDGET=lean

# The constitution's review loop (constitution/articles/article.rigour.md): the most rounds a
# reviewing agent runs before a pull request is raised; 0 disables the loop.
ORCH_REVIEW_ROUNDS=1

# —— Modules ———————————————————————————————————————————————————————————————— #

# Keys a module reads; the core ignores them. Set them when the module is adopted.
#
# The graphify module (common/modules/graphify/): the repositories to graph, one word per
# repository as <slug>=<path>, the path relative to this root (`../<name>` for a sibling
# in the workspace, `.` for this tree); and an optional pin, which makes a scan refuse
# any other graphify version so every machine builds the same graph.
# GRAPHS="lantern=../lantern"
# GRAPHIFY_VERSION=0.9.65
